# Configuration of actions/dependency-review-action, read by the dependency-review job in
# .github/workflows/ci.yml. The action checks only the dependencies that a pull request adds
# or changes, in every ecosystem of the dependency graph.
# Option names: the action's README, "Configuration options".

# A dependency under any other license fails the job. A license that the action cannot detect
# gives a warning only. LicenseTests in apps/api still checks every NuGet package against the
# shorter list of fixed rule 4.
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - PostgreSQL
  - BlueOak-1.0.0
  - Python-2.0
  - CC0-1.0
  - Unlicense

# A known vulnerability of high or critical severity fails the job.
fail-on-severity: high

# The job's token is read-only, so the summary goes to the job log and not to a comment.
comment-summary-in-pr: never

# Exceptions by package, for a license outside allow-licenses. Each one names its reason (the action's README,
# "allow-dependencies-licenses").
# - axe-core and @axe-core/playwright are MPL-2.0, a file-level copyleft license that is not commercial. They run only in the
#   Playwright tests, for the WCAG 2.2 AA check of every page (F37 in docs/frontend/ARCHITECTURE.md), and no build ships them.
#   The maintainer's decision in step 21a.
# - json-schema-typed: GitHub's detection adds "JSON" to its license, but the package's LICENSE.md and every file of 8.0.2 say
#   BSD-2-Clause. It comes with react-email through conf, which uses it for TypeScript types only (types.d.ts), and no build ships
#   it. The maintainer's decision in step r14.
allow-dependencies-licenses:
  - pkg:npm/axe-core
  - pkg:npm/%40axe-core/playwright
  - pkg:npm/json-schema-typed

name: Delivery

# Delivers main. This file builds nothing itself. The jobs run in this order:
# 1. ci: calls ci.yml, which builds, tests and scans the images and keeps the tested images.
# 2. publish-api, publish-web, publish-platform: publish those images to GHCR and attest them, with publish-image.yml.
# 3. deploy-staging: deploys the three digests to staging with deploy.yml.
# 4. deploy-production: deploys the same digests to production with deploy.yml, after the maintainer's approval.
# 5. tag-release: names the version that production now runs.
# docs/deployment.md describes the flow.
on:
  push:
    branches: [main]

# Each run gets a group of its own. A run whose production job waits for an approval holds its
# group, and GitHub does not cancel it, so a shared group would stop every newer push to main until
# the approval is answered (community discussion 135220). The deploy jobs keep their own groups in
# deploy.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    permissions:
      contents: read # the jobs of ci.yml read the repository only
    uses: $/.github/workflows/ci.yml
    with:
      keep-image: true

  # Push the images that ci.yml tested to GHCR and attest them (SLSA v1.0, Build Level 2), with the steps of
  # publish-image.yml. A caller must grant the permissions of the called job.
  publish-api:
    name: "API image: publish"
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push the image and the attestations to GHCR
      id-token: write # get the OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations in the repository
    uses: $/.github/workflows/publish-image.yml
    with:
      app: api

  publish-web:
    name: "Web image: publish"
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push the image and the attestations to GHCR
      id-token: write # get the OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations in the repository
    uses: $/.github/workflows/publish-image.yml
    with:
      app: web

  publish-platform:
    name: "Platform image: publish"
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push the image and the attestations to GHCR
      id-token: write # get the OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations in the repository
    uses: $/.github/workflows/publish-image.yml
    with:
      app: platform

  # Deploys the three published digests to staging with the steps in deploy.yml. The repository variable
  # DEPLOY_STAGING switches the job on. Without it the job is skipped, and main stays green before
  # a product has a Railway project.
  deploy-staging:
    name: "Deploy to staging"
    needs: [publish-api, publish-web, publish-platform]
    if: vars.DEPLOY_STAGING == 'true'
    permissions:
      contents: read
      packages: read # deploy.yml pulls the image from GHCR
      deployments: read # deploy.yml's production check reads deployments; a caller must grant it
    uses: $/.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish-api.outputs.image }}
      web-image: ${{ needs.publish-web.outputs.image }}
      platform-image: ${{ needs.publish-platform.outputs.image }}
    # GitHub passes an environment secret only by name. The called job sets `environment: staging`,
    # so it gets the staging values (GitHub Docs, "Reuse workflows").
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATIONS_CONNECTION_STRING: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}
      MIGRATIONS_ROOT_CERTIFICATE: ${{ secrets.MIGRATIONS_ROOT_CERTIFICATE }}

  # Deploys the digests that staging ran to production, after the maintainer approves the waiting
  # job: the environment production requires a reviewer ("push-button release", Continuous Delivery,
  # chapter 5). The repository variable DEPLOY_PRODUCTION switches the job on. deploy.yml refuses a
  # commit that is older than the one production runs.
  deploy-production:
    name: "Deploy to production"
    needs: [publish-api, publish-web, publish-platform, deploy-staging]
    if: vars.DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      packages: read # deploy.yml pulls the image from GHCR
      deployments: read # deploy.yml reads the latest successful production deployment
    uses: $/.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish-api.outputs.image }}
      web-image: ${{ needs.publish-web.outputs.image }}
      platform-image: ${{ needs.publish-platform.outputs.image }}
    # The called job sets `environment: production`, so it gets the production values.
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATIONS_CONNECTION_STRING: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}
      MIGRATIONS_ROOT_CERTIFICATE: ${{ secrets.MIGRATIONS_ROOT_CERTIFICATE }}

  # Names the version that production now runs: a CalVer tag vYYYY.0M.0D.N in UTC (calver.org),
  # with N from 1 each day. A tag therefore always names a version that ran in production. The tag
  # goes on the commit and on each image digest in GHCR. A tag that GITHUB_TOKEN creates starts no
  # workflow. Only this job may write to the repository.
  tag-release:
    name: "Tag the release"
    needs: [publish-api, publish-web, publish-platform, deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release tag
      packages: write # add the release tag to the image in GHCR
    env:
      IMAGES: >-
        ${{ needs.publish-api.outputs.image }}
        ${{ needs.publish-web.outputs.image }}
        ${{ needs.publish-platform.outputs.image }}
    steps:
      - name: Compute the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y.%m.%d)
          highest=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$today." --jq '.[].ref' |
            sed -n -E "s/^refs\/tags\/v${today//./\\.}\.([1-9][0-9]*)$/\1/p" | sort -n | tail -n 1)
          tag="v$today.$(( ${highest:-0} + 1 ))"
          echo "Tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # An annotated tag: first the tag object, then the ref that names it.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG of $IMAGES" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      # --prefer-index=false copies the manifest as it is; by default buildx wraps a single
      # manifest in a new index, which has a new digest.
      - name: Name the version in the registry
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for image in $IMAGES; do
            name="${image%@*}"
            docker buildx imagetools create --prefer-index=false --tag "$name:$TAG" "$image"
            tagged=$(docker buildx imagetools inspect "$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
            if [[ "$tagged" != "${image#*@}" ]]; then
              echo "::error::$name:$TAG names $tagged, not ${image#*@}."
              exit 1
            fi
            echo "Released $TAG: $image"
          done

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

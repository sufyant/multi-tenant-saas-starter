name: Publish image

# The only copy of the publish steps. delivery.yml calls it once for each image: api, web and platform.
# It pushes the image that ci.yml tested to GHCR and attests it (SLSA v1.0, Build Level 2). It builds nothing
# (Humble and Farley, Continuous Delivery, chapter 5: "Only build your binaries once").
# The jobs of a called workflow run in the caller's run (the github context, run_id included, is the caller's), and
# download-artifact reads the current run by default. So the job downloads the artifact that ci.yml uploaded (GitHub Docs,
# "Reusing workflow configurations", "github context"; actions/download-artifact README, "run-id").
# Sigstore names this file as the signer workflow of the attestations, because a reusable workflow signs them
# (GitHub Docs, "Using artifact attestations and reusable workflows to achieve SLSA v1 Build Level 3"). rollback.yml checks it.
# Syft is pinned by digest, like Grype. Dependabot does not update an image in a run step (docs/github-settings.md, section 6).
on:
  workflow_call:
    inputs:
      app:
        description: "The image: api, web or platform. The artifact is <app>-image, with the archive <app>.tar"
        required: true
        type: string
    outputs:
      image:
        description: "The published image with its digest: ghcr.io/<owner>/<repo>/<app>@sha256:<digest>"
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  publish:
    name: "Publish ${{ inputs.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the image and the attestations to GHCR
      id-token: write # get the OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations in the repository
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      APP: ${{ inputs.app }}
      SYFT_IMAGE: ghcr.io/anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.app }}-image
          path: ${{ runner.temp }}/image

      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/image/$APP.tar"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      # The script checks APP. The deploy uses the digest that the registry returns, never a tag.
      - name: Push the image
        id: push
        run: scripts/deploy/push-image.sh

      # Syft reads the saved archive, like Grype, so it needs no access to the Docker socket.
      - name: Make the SBOM
        run: |
          docker run --rm -v "$RUNNER_TEMP/image/$APP.tar:/image.tar:ro" "$SYFT_IMAGE" \
            docker-archive:/image.tar --output spdx-json > "$RUNNER_TEMP/sbom.spdx.json"

      # actions/attest replaces actions/attest-build-provenance and actions/attest-sbom.
      # The storage record needs the artifact-metadata permission, which this job does not have.
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      # actions/attest names the SBOM predicate type after the SBOM's SPDX version.
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
          spdx_version=$(jq -r .spdxVersion "$RUNNER_TEMP/sbom.spdx.json")
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --predicate-type "https://spdx.dev/Document/v${spdx_version#SPDX-}"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

name: CI

on:
  pull_request:
  # On a push to main, publish-api publishes the tested API image, deploy-staging deploys it,
  # deploy-production deploys it after the maintainer's approval, and tag-release names the version.
  push:
    branches: [main]

# Runs of one pull request share a group, and a newer run cancels the older one. Each run on main
# gets a group of its own. A run whose production job waits for an approval holds its group, and
# GitHub does not cancel it, so a shared group would stop every newer push to main until the approval
# is answered (community discussion 135220). The deploy jobs keep their own groups in deploy.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A timeout stops a job that hangs. It is not a performance target.
# The commit stage should finish in under 10 minutes (Continuous Delivery, ch. 3).
# Typical times: node about 45 s, api about 3 min.
jobs:
  node:
    name: "Node: lint, types, tests, build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # packageManager in package.json fixes the pnpm version.
      - run: corepack enable

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # setup-node can cache pnpm only when pnpm is installed before setup-node runs.
      # Here corepack from the Node that setup-node installs provides pnpm, so the
      # store is cached with actions/cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # .railway/railway.ts belongs to no workspace package, so turbo does not check its types.
      - run: pnpm exec tsc -p .railway

      # The api job builds and tests .NET.
      - run: pnpm turbo run check-types test build '--filter=!@repo/api'

  api:
    name: "API: build and test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      # Whitespace only: the build enforces style and analyzers. It needs no build, so it fails fast.
      # .editorconfig marks the migrations as generated code, so the check skips them.
      - run: dotnet format whitespace Api.slnx --verify-no-changes

      - run: dotnet build Api.slnx

      # The tests start PostgreSQL 18 in Docker. The runner has Docker.
      - run: dotnet test --solution Api.slnx --no-build

  # The image jobs test the images, not the business logic. The api job runs the test suite.
  # Grype and PostgreSQL are pinned by digest. Dependabot does not update an image in a run step
  # (docs/github-settings.md, section 6).
  api-image:
    name: "API image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
      # PostgreSQL 18.6
      POSTGRES_IMAGE: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The labels name the repository and the commit that the image comes from (OCI image spec,
      # "Pre-Defined Annotation Keys").
      - name: Build the image
        run: |
          docker build -t api \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            apps/api

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect api --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      # Grype reads a saved archive, so it needs no access to the Docker socket.
      # The first run prints every vulnerability. The second fails on a high or critical one with a fix.
      - name: Scan the image
        run: |
          docker save api -o "$RUNNER_TEMP/api.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/api.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The script holds the steps and their reasons (scripts/ci/run-api-image.sh).
      - name: Run the migration, the web and the worker against PostgreSQL
        run: scripts/ci/run-api-image.sh

      # publish-api pushes this tested archive. It does not build the image again
      # (Humble and Farley, Continuous Delivery, chapter 5: "Only build your binaries once").
      - name: Keep the tested image for publish-api
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-image
          path: ${{ runner.temp }}/api.tar
          if-no-files-found: error
          retention-days: 1

      - name: Print the container logs
        if: failure()
        run: |
          for container in api-db api-web api-worker; do
            echo "::group::$container"
            docker logs "$container" || true
            echo "::endgroup::"
          done

      - name: Remove the containers and the network
        if: always()
        run: |
          docker rm -f api-db api-web api-worker || true
          docker network rm api-image || true

  web-image:
    name: "Web image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f apps/web/Dockerfile --build-arg NODE_MAJOR="$(cat .nvmrc)" -t web .

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect web --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      - name: Scan the image
        run: |
          docker save web -o "$RUNNER_TEMP/web.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/web.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The server needs Clerk keys. These are fake and well formed: the publishable key names
      # clerk.example.invalid, which does not resolve. No real key is used at build or run time.
      - name: Run the image
        run: scripts/ci/run-web-image.sh

      - name: Print the container logs
        if: failure()
        run: docker logs web || true

      - name: Remove the container
        if: always()
        run: docker rm -f web || true

  # GitHub's dependency review checks the dependencies that a pull request adds or changes, in
  # every ecosystem: their licenses and their known vulnerabilities. The settings are in
  # .github/dependency-review-config.yml. It compares the base and the head of a pull request,
  # so it does not run on push.
  dependency-review:
    name: "Dependency review: licenses and vulnerabilities"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The action reads its configuration file from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # This is the only required status check. A new job is added to `needs` here,
  # in the diff, not in the repository settings.
  ci:
    name: CI
    needs: [node, api, api-image, web-image, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # A needed job passes with `success`. dependency-review runs on pull requests only, so on
      # push it is `skipped`, and `skipped` passes for that job only. `failure` and `cancelled`
      # fail for every job.
      - name: Check that every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' > /dev/null

  # Pushes the image that api-image tested to GHCR and attests it (SLSA v1.0, Build Level 2).
  # Syft is pinned by digest, like Grype. Dependabot does not update an image in a run step
  # (docs/github-settings.md, section 6).
  publish-api:
    name: "API image: publish"
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the image and the attestations to GHCR
      id-token: write # get the OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations in the repository
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      SYFT_IMAGE: ghcr.io/anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-image
          path: ${{ runner.temp }}/api-image

      - name: Load the tested image
        run: docker load -i "$RUNNER_TEMP/api-image/api.tar"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      # A registry name is lower case, and an owner name can have capitals.
      # The deploy uses the digest that the registry returns, never a tag.
      - name: Push the image
        id: push
        run: scripts/deploy/push-api-image.sh

      # Syft reads the saved archive, like Grype, so it needs no access to the Docker socket.
      - name: Make the SBOM
        run: |
          docker run --rm -v "$RUNNER_TEMP/api-image/api.tar:/image.tar:ro" "$SYFT_IMAGE" \
            docker-archive:/image.tar --output spdx-json > "$RUNNER_TEMP/sbom.spdx.json"

      # actions/attest replaces actions/attest-build-provenance and actions/attest-sbom.
      # The storage record needs the artifact-metadata permission, which this job does not have.
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      # actions/attest names the SBOM predicate type after the SBOM's SPDX version.
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"
          spdx_version=$(jq -r .spdxVersion "$RUNNER_TEMP/sbom.spdx.json")
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --predicate-type "https://spdx.dev/Document/v${spdx_version#SPDX-}"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Deploys the published digest to staging with the steps in deploy.yml. The repository variable
  # DEPLOY_STAGING switches the job on. Without it the job is skipped, and main stays green before
  # a product has a Railway project.
  deploy-staging:
    name: "API: deploy to staging"
    needs: [publish-api]
    if: vars.DEPLOY_STAGING == 'true'
    permissions:
      contents: read
      packages: read # deploy.yml pulls the image from GHCR
      deployments: read # deploy.yml's production check reads deployments; a caller must grant it
    uses: $/.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish-api.outputs.image }}
    # GitHub passes an environment secret only by name. The called job sets `environment: staging`,
    # so it gets the staging values (GitHub Docs, "Reuse workflows").
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATIONS_CONNECTION_STRING: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}

  # Deploys the digest that staging ran to production, after the maintainer approves the waiting
  # job: the environment production requires a reviewer ("push-button release", Continuous Delivery,
  # chapter 5). The repository variable DEPLOY_PRODUCTION switches the job on. deploy.yml refuses a
  # commit that is older than the one production runs.
  deploy-production:
    name: "API: deploy to production"
    needs: [publish-api, deploy-staging]
    if: vars.DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      packages: read # deploy.yml pulls the image from GHCR
      deployments: read # deploy.yml reads the latest successful production deployment
    uses: $/.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish-api.outputs.image }}
    # The called job sets `environment: production`, so it gets the production values.
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATIONS_CONNECTION_STRING: ${{ secrets.MIGRATIONS_CONNECTION_STRING }}

  # Names the version that production now runs: a CalVer tag vYYYY.0M.0D.N in UTC (calver.org),
  # with N from 1 each day. A tag therefore always names a version that ran in production. The tag
  # goes on the commit and on the image digest in GHCR. A tag that GITHUB_TOKEN creates starts no
  # workflow. Only this job may write to the repository.
  tag-release:
    name: "Tag the release"
    needs: [publish-api, deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release tag
      packages: write # add the release tag to the image in GHCR
    env:
      IMAGE: ${{ needs.publish-api.outputs.image }}
    steps:
      - name: Compute the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y.%m.%d)
          highest=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$today." --jq '.[].ref' |
            sed -n -E "s/^refs\/tags\/v${today//./\\.}\.([1-9][0-9]*)$/\1/p" | sort -n | tail -n 1)
          tag="v$today.$(( ${highest:-0} + 1 ))"
          echo "Tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # An annotated tag: first the tag object, then the ref that names it.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG of $IMAGE" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      # --prefer-index=false copies the manifest as it is; by default buildx wraps a single
      # manifest in a new index, which has a new digest.
      - name: Name the version in the registry
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          name="${IMAGE%@*}"
          digest="${IMAGE#*@}"
          docker buildx imagetools create --prefer-index=false --tag "$name:$TAG" "$IMAGE"
          tagged=$(docker buildx imagetools inspect "$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$tagged" != "$digest" ]]; then
            echo "::error::$name:$TAG names $tagged, not $digest."
            exit 1
          fi
          echo "Released $TAG: $IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

name: CI

on:
  pull_request:
  # Railway's "Wait for CI" needs a workflow that runs on push to main.
  push:
    branches: [main]

# A cancelled run on main would make Railway skip a deployment,
# so only pull request runs cancel the run before them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A timeout stops a job that hangs. It is not a performance target.
# The commit stage should finish in under 10 minutes (Continuous Delivery, ch. 3).
# Typical times: node about 45 s, api about 3 min.
jobs:
  node:
    name: "Node: lint, types, tests, build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # packageManager in package.json fixes the pnpm version.
      - run: corepack enable

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # setup-node can cache pnpm only when pnpm is installed before setup-node runs.
      # Here corepack from the Node that setup-node installs provides pnpm, so the
      # store is cached with actions/cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # The api job builds and tests .NET.
      - run: pnpm turbo run check-types test build '--filter=!@repo/api'

  api:
    name: "API: build and test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      # Whitespace only: the build enforces style and analyzers. It needs no build, so it fails fast.
      # .editorconfig marks the migrations as generated code, so the check skips them.
      - run: dotnet format whitespace Api.slnx --verify-no-changes

      - run: dotnet build Api.slnx

      # The tests start PostgreSQL 18 in Docker. The runner has Docker.
      - run: dotnet test --solution Api.slnx --no-build

  # The image jobs test the images, not the business logic. The api job runs the test suite.
  # Grype and PostgreSQL are pinned by digest. Dependabot does not update an image in a run step
  # (docs/github-settings.md, section 6).
  api-image:
    name: "API image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
      # PostgreSQL 18.6
      POSTGRES_IMAGE: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The labels name the repository and the commit that the image comes from (OCI image spec,
      # "Pre-Defined Annotation Keys").
      - name: Build the image
        run: |
          docker build -t api \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            apps/api

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect api --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      # Grype reads a saved archive, so it needs no access to the Docker socket.
      # The first run prints every vulnerability. The second fails on a high or critical one with a fix.
      - name: Scan the image
        run: |
          docker save api -o "$RUNNER_TEMP/api.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/api.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The passwords are made for this run and printed nowhere. They protect nothing outside it.
      - name: Run the migration, the web and the worker against PostgreSQL
        run: |
          superuser_password=$(openssl rand -hex 24)
          provider_password=$(openssl rand -hex 24)
          owner_password=$(openssl rand -hex 24)
          application_password=$(openssl rand -hex 24)

          docker network create api-image
          docker run -d --name api-db --network api-image \
            -e POSTGRES_PASSWORD="$superuser_password" -e POSTGRES_DB=app "$POSTGRES_IMAGE"

          # Over TCP: while the image sets up the database, the server listens only on its socket.
          for _ in $(seq 30); do
            docker exec api-db pg_isready -h 127.0.0.1 -U postgres -d app && break
            sleep 1
          done
          docker exec api-db pg_isready -h 127.0.0.1 -U postgres -d app

          # A managed provider gives no superuser. Its most privileged role has CREATEROLE, CREATEDB and
          # BYPASSRLS and owns the database, like neondb_owner on Neon (apps/api/docs/setup.md).
          docker exec api-db psql -U postgres -d app -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE provider_admin LOGIN CREATEROLE CREATEDB BYPASSRLS PASSWORD '$provider_password'" \
            -c "ALTER DATABASE app OWNER TO provider_admin"

          # The two roles, as in apps/api/docs/local-run.md section 2, as the provider's role over the network.
          bootstrap() {
            docker run --rm -i --network api-image -e PGPASSWORD="$provider_password" "$POSTGRES_IMAGE" \
              psql -h api-db -U provider_admin -d app \
              -v owner_password="$1" -v application_password="$2" -f - < apps/api/db/bootstrap.sql
          }
          roles() {
            docker exec api-db psql -U postgres -d app -At \
              -c "SELECT * FROM pg_roles WHERE rolname IN ('api_owner', 'api_application') ORDER BY rolname"
          }

          # A rerun changes only the passwords: the steps below log in with the second run's passwords.
          bootstrap "$(openssl rand -hex 24)" "$(openssl rand -hex 24)"
          roles > "$RUNNER_TEMP/roles-first.txt"
          bootstrap "$owner_password" "$application_password"
          roles > "$RUNNER_TEMP/roles-second.txt"
          cat "$RUNNER_TEMP/roles-second.txt"
          diff "$RUNNER_TEMP/roles-first.txt" "$RUNNER_TEMP/roles-second.txt"

          # A role that someone changed by hand stops a rerun, which names the role and the attribute.
          docker exec api-db psql -U postgres -d app -c "ALTER ROLE api_application BYPASSRLS"
          if bootstrap "$owner_password" "$application_password" 2> "$RUNNER_TEMP/changed-role.txt"; then
            echo "The script ran on although api_application can bypass RLS." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/changed-role.txt"
          grep -q "api_application has BYPASSRLS" "$RUNNER_TEMP/changed-role.txt"
          docker exec api-db psql -U postgres -d app -c "ALTER ROLE api_application NOBYPASSRLS"

          # Only the owner role's connection (R3).
          docker run --rm --network api-image \
            -e ConnectionStrings__Migrations="Host=api-db;Port=5432;Database=app;Username=api_owner;Password=$owner_password" \
            api migrate

          # Every required setting (apps/api/docs/configuration.md). The fake values reach no real service.
          {
            echo "ASPNETCORE_ENVIRONMENT=Production"
            echo "ConnectionStrings__Database=Host=api-db;Port=5432;Database=app;Username=api_application;Password=$application_password"
            echo "Authentication__Clerk__Issuer=https://clerk.example.invalid"
            echo "Authentication__Clerk__AuthorizedParties__0=https://app.example.invalid"
            echo "ControlPlane__FirstSystemAdminEmail=admin@example.invalid"
            echo "ControlPlane__Clerk__SecretKey=sk_test_fake_not_a_secret"
            echo "ControlPlane__Clerk__BackendApiUrl=https://clerk.example.invalid/v1/"
            echo "ControlPlane__Invitations__AcceptUrl=https://app.example.invalid/invitations/accept"
            echo "Notifications__Resend__ApiKey=re_fake_not_a_secret"
            echo "Notifications__Resend__From=App <no-reply@example.invalid>"
            echo "Notifications__Resend__ApiUrl=https://resend.example.invalid/"
          } > "$RUNNER_TEMP/api.env"

          docker run -d --name api-web --network api-image -p 8080:8080 \
            --env-file "$RUNNER_TEMP/api.env" -e Host__Role=web api
          docker run -d --name api-worker --network api-image -p 8081:8080 \
            --env-file "$RUNNER_TEMP/api.env" -e Host__Role=worker api

          # The worker serves the health endpoints too (apps/api/docs/local-run.md section 6).
          for port in 8080 8081; do
            curl --silent --show-error --fail --max-time 5 \
              --retry 60 --retry-delay 1 --retry-all-errors --retry-max-time 60 \
              "http://localhost:$port/health/ready"
            echo " on port $port"
          done

      # publish-api pushes this tested archive. It does not build the image again
      # (Humble and Farley, Continuous Delivery, chapter 5: "Only build your binaries once").
      - name: Keep the tested image for publish-api
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-image
          path: ${{ runner.temp }}/api.tar
          if-no-files-found: error
          retention-days: 1

      - name: Print the container logs
        if: failure()
        run: |
          for container in api-db api-web api-worker; do
            echo "::group::$container"
            docker logs "$container" || true
            echo "::endgroup::"
          done

      - name: Remove the containers and the network
        if: always()
        run: |
          docker rm -f api-db api-web api-worker || true
          docker network rm api-image || true

  web-image:
    name: "Web image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f apps/web/Dockerfile --build-arg NODE_MAJOR="$(cat .nvmrc)" -t web .

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect web --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      - name: Scan the image
        run: |
          docker save web -o "$RUNNER_TEMP/web.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/web.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The server needs Clerk keys. These are fake and well formed: the publishable key names
      # clerk.example.invalid, which does not resolve. No real key is used at build or run time.
      - name: Run the image
        run: |
          docker run -d --name web -p 3000:3000 \
            -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="pk_test_$(printf 'clerk.example.invalid$' | base64)" \
            -e CLERK_SECRET_KEY=sk_test_fake_not_a_secret \
            -e CLERK_TELEMETRY_DISABLED=1 \
            web
          # The sign-in page needs no sign-in. Any status below 500 passes.
          for _ in $(seq 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              http://localhost:3000/sign-in || true)
            if [[ "$status" =~ ^[1-4][0-9][0-9]$ ]]; then
              echo "GET /sign-in: $status"
              exit 0
            fi
            sleep 1
          done
          echo "GET /sign-in did not answer below 500 in 30 seconds. Last status: $status" >&2
          exit 1

      - name: Print the container logs
        if: failure()
        run: docker logs web || true

      - name: Remove the container
        if: always()
        run: docker rm -f web || true

  # GitHub's dependency review checks the dependencies that a pull request adds or changes, in
  # every ecosystem: their licenses and their known vulnerabilities. The settings are in
  # .github/dependency-review-config.yml. It compares the base and the head of a pull request,
  # so it does not run on push.
  dependency-review:
    name: "Dependency review: licenses and vulnerabilities"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The action reads its configuration file from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # This is the only required status check. A new job is added to `needs` here,
  # in the diff, not in the repository settings.
  ci:
    name: CI
    needs: [node, api, api-image, web-image, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # A needed job passes with `success`. dependency-review runs on pull requests only, so on
      # push it is `skipped`, and `skipped` passes for that job only. `failure` and `cancelled`
      # fail for every job.
      - name: Check that every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' > /dev/null

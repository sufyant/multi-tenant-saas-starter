name: CI

# Verification only: test, build and scan. It publishes and deploys nothing.
# It runs on a pull request. delivery.yml calls it on a push to main, with keep-image: true.
on:
  pull_request:
  workflow_call:
    inputs:
      keep-image:
        description: "true keeps the tested API image as the artifact api-image, for publish-api in delivery.yml"
        type: boolean
        required: false
        default: false

# In a called workflow, the github context is the caller's: github.workflow is "Delivery",
# github.event_name is "push" and github.run_id is the caller's run (GitHub Docs, "Reusing workflow
# configurations", "github context"). The same docs warn that the same concurrency group in a caller
# and a called workflow cancels or blocks the caller ("Supported keywords for jobs that call a
# reusable workflow"). So the group starts with the fixed name "ci", not github.workflow:
# - On a pull request, the group is ci-refs/pull/<number>/merge, and a newer run cancels the older one.
# - Called from delivery.yml, the group is ci-<run id>: one group per run, never cancelled, and
#   never the group of delivery.yml (Delivery-<run id>). So it never cancels or blocks a delivery run.
# (GitHub Docs, "Control the concurrency of workflows and jobs".)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A timeout stops a job that hangs. It is not a performance target.
# The commit stage should finish in under 10 minutes (Continuous Delivery, ch. 3).
# Typical times: node about 45 s, api about 3 min.
jobs:
  node:
    name: "Node: lint, types, tests, build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # packageManager in package.json fixes the pnpm version.
      - run: corepack enable

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # setup-node can cache pnpm only when pnpm is installed before setup-node runs.
      # Here corepack from the Node that setup-node installs provides pnpm, so the
      # store is cached with actions/cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # .railway/railway.ts belongs to no workspace package, so turbo does not check its types.
      - run: pnpm exec tsc -p .railway

      # The scripts hold the long steps of the workflows. shellcheck checks them. The GitHub-hosted
      # Ubuntu image has shellcheck (actions/runner-images, Ubuntu 24.04 readme).
      - name: Check the shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      # The GitHub-hosted Ubuntu image has jq (actions/runner-images, Ubuntu 24.04 readme).
      - name: Check the agent skills
        run: scripts/ci/check-agent-skills.sh

      # The client types are generated from the committed OpenAPI document, never written by hand (N11). The step reads
      # apps/api/openapi/v1.json, so it needs no .NET. OpenApiDocumentFileTests in the api job checks that the document is current.
      - name: Check that the API client types match the OpenAPI document
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client/src/schema.ts

      # The api job builds and tests .NET.
      - run: pnpm turbo run check-types test build '--filter=!@repo/api'

  api:
    name: "API: build and test"
    runs-on: ubuntu-latest
    # The tests take about 6.5 minutes, in two parts one after the other (scripts/ci/test-api.sh).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      # Whitespace only: the build enforces style and analyzers. It needs no build, so it fails fast.
      # .editorconfig marks the migrations as generated code, so the check skips them.
      - run: dotnet format whitespace Api.slnx --verify-no-changes

      - run: dotnet build Api.slnx

      # The tests start PostgreSQL 18 in Docker. The runner has Docker.
      # A hung run of Api.IntegrationTests writes a dump, the tests in progress and its diagnostic log to the results directory
      # (section 9, rule 8 of apps/api/docs/ARCHITECTURE.md).
      # The script runs the tests on runtime handler code apart from the others, prints the peak memory of each test process and
      # stops one that passes 11 GB (section 9, rule 11).
      - name: Test
        working-directory: .
        run: scripts/ci/test-api.sh

      # A hang that runs into timeout-minutes cancels the job, so the step runs on a cancel too.
      - name: Keep the evidence of a failed test run
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-results
          path: apps/api/TestResults
          if-no-files-found: ignore
          retention-days: 7

  # The image jobs test the images, not the business logic. The api job runs the test suite.
  # Grype and PostgreSQL are pinned by digest. Dependabot does not update an image in a run step
  # (docs/github-settings.md, section 6).
  api-image:
    name: "API image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
      # PostgreSQL 18.6
      POSTGRES_IMAGE: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The labels name the repository and the commit that the image comes from (OCI image spec,
      # "Pre-Defined Annotation Keys").
      - name: Build the image
        run: |
          docker build -t api \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            apps/api

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect api --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      # Grype reads a saved archive, so it needs no access to the Docker socket.
      # The first run prints every vulnerability. The second fails on a high or critical one with a fix.
      - name: Scan the image
        run: |
          docker save api -o "$RUNNER_TEMP/api.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/api.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The script holds the steps and their reasons (scripts/ci/run-api-image.sh).
      - name: Run the migration, the web and the worker against PostgreSQL
        run: scripts/ci/run-api-image.sh

      # publish-api in delivery.yml pushes this tested archive. It does not build the image again
      # (Humble and Farley, Continuous Delivery, chapter 5: "Only build your binaries once").
      # On a pull request, inputs is empty, so the step is skipped.
      - name: Keep the tested image for publish-api
        if: inputs.keep-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}/api.tar
          if-no-files-found: error
          retention-days: 1

      - name: Print the container logs
        if: failure()
        run: |
          for container in api-db api-web api-worker; do
            echo "::group::$container"
            docker logs "$container" || true
            echo "::endgroup::"
          done

      - name: Remove the containers and the network
        if: always()
        run: |
          docker rm -f api-db api-web api-worker || true
          docker network rm api-image || true

  web-image:
    name: "Web image: build, scan, run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f apps/web/Dockerfile --build-arg NODE_MAJOR="$(cat .nvmrc)" -t web .

      - name: Check that the image runs as a non-root user
        run: |
          user=$(docker image inspect web --format '{{.Config.User}}')
          echo "User: ${user:-<none>}"
          # Kubernetes verifies runAsNonRoot only for a numeric user.
          uid=${user%%:*}
          if [[ ! "$uid" =~ ^[0-9]+$ ]] || (( 10#$uid == 0 )); then
            echo "The image must run as a numeric user other than 0." >&2
            exit 1
          fi

      - name: Scan the image
        run: |
          docker save web -o "$RUNNER_TEMP/web.tar"
          grype() {
            docker run --rm -e GRYPE_DB_CACHE_DIR=/grype-db -v grype-db:/grype-db \
              -v "$RUNNER_TEMP/web.tar:/image.tar:ro" "$GRYPE_IMAGE" docker-archive:/image.tar "$@"
          }
          grype
          grype --only-fixed --fail-on high

      # The server needs Clerk keys. These are fake and well formed: the publishable key names
      # clerk.example.invalid, which does not resolve. No real key is used at build or run time.
      - name: Run the image
        run: scripts/ci/run-web-image.sh

      - name: Print the container logs
        if: failure()
        run: docker logs web || true

      - name: Remove the container
        if: always()
        run: docker rm -f web || true

  # GitHub's dependency review checks the dependencies that a pull request adds or changes, in
  # every ecosystem: their licenses and their known vulnerabilities. The settings are in
  # .github/dependency-review-config.yml. It compares the base and the head of a pull request,
  # so it does not run on push.
  dependency-review:
    name: "Dependency review: licenses and vulnerabilities"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The action reads its configuration file from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  # This is the only required status check. A new job is added to `needs` here,
  # in the diff, not in the repository settings.
  ci:
    name: CI
    needs: [node, api, api-image, web-image, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # A needed job passes with `success`. dependency-review runs on pull requests only, so on
      # push it is `skipped`, and `skipped` passes for that job only. `failure` and `cancelled`
      # fail for every job.
      - name: Check that every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.key == "dependency-review" and .value.result == "skipped"))' > /dev/null

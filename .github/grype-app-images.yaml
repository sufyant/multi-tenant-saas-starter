# Grype's configuration for the scans of the web and platform images (ci.yml, "Scan the image"). The API image's scan does
# not read it: that image is Ubuntu, with a zlib1g of its own.
#
# zlib1g 1:1.3.dfsg+really1.3.1-1+b1 of the runtime base image gcr.io/distroless/nodejs22-debian13 has CVE-2026-76844 and
# CVE-2026-85091 (High), fixed in 1:1.3.dfsg+really1.3.1-1+deb13u1. The image has no package manager, so the fix comes only
# with a new digest of the base image, which did not exist on 2026-11-08.
#
# Why the vulnerable library does not reach the app: /nodejs/bin/node needs no libz.so (its NEEDED entries are libdl,
# libstdc++, libm, libgcc_s, libpthread, libc and ld-linux) and carries its own zlib. No native module of the app needs
# libz.so: sharp and libvips need neither it nor libcrypto. Only the system libcrypto.so.3 needs libz.so, and node does
# not load it: it carries its own OpenSSL. The running web and platform apps, after gzip answers, map no libz.so.
#
# Each rule names the CVE and the package, so any other finding still fails the scan.
#
# Remove when the distroless digest has the fixed zlib. The rules end on the date below: after it, the step "Check the scan
# exceptions" of ci.yml fails (scripts/ci/check-scan-exceptions.sh).
# expires: 2026-11-22
ignore:
  - vulnerability: CVE-2026-76844
    package:
      name: zlib1g
      type: deb
  - vulnerability: CVE-2026-85091
    package:
      name: zlib1g
      type: deb

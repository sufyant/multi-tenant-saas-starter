# Dependabot version updates. Security updates are enabled in the
# repository settings (docs/github-settings.md) and use the groups below.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
    # A new release waits 7 days. A compromised release is often pulled
    # within days. Cooldown applies to version updates only.
    cooldown:
      default-days: 7
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  # Dependabot updates pnpm projects through the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # The base images in the Dockerfiles, pinned by digest. Dependabot updates the digest,
  # and the tag too where the tag names a full version.
  # Daily and no cooldown: the image scan in CI fails on a vulnerability with a fix, so a fixed
  # base image must arrive at once. A cooldown protects against a new package release that is
  # later found to be harmful. A base image is pinned by digest and scanned on every update.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: daily
    # A Node major version changes .nvmrc, the build image and the distroless runtime image
    # together (apps/web/Dockerfile). That is a planned upgrade, not a Dependabot update.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
